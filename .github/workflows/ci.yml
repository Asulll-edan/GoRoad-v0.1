name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-road-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -cover -race -timeout 120s

  python-services:
    name: Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [py-ai-service, py-analytics-service, py-data-pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov
      - run: pytest tests/ -v --cov=app --cov-report=term --ignore=tests/integration || echo "No tests yet"

  flutter-app:
    name: Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_road_app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  nextjs-admin:
    name: Next.js Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-road-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build --parallel
