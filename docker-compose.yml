version: "3.9"

x-shared: &shared
  restart: unless-stopped
  networks:
    - goroad-network

services:
  # ============================================
  # DATABASE
  # ============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: goroad-postgres
    <<: *shared
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sandiandasalah
      POSTGRES_DB: goroad_dbvi1
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS 7
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: goroad-redis
    <<: *shared
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # NATS JETSTREAM
  # ============================================
  nats:
    image: nats:2.10-alpine
    container_name: goroad-nats
    <<: *shared
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -m 8222

  # ============================================
  # MINIO (Object Storage)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: goroad-minio
    <<: *shared
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: goroad_admin
      MINIO_ROOT_PASSWORD: goroad_secret_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ============================================
  # NGINX GATEWAY
  # ============================================
  nginx:
    image: nginx:1.26-alpine
    container_name: goroad-nginx
    <<: *shared
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - go-api
      - go-ws
      - py-ai-service
      - py-analytics-service
      - admin

  # ============================================
  # GO BACKEND — API
  # ============================================
  go-api:
    build:
      context: ./go-road-backend
      dockerfile: ../docker/Dockerfile.go
      target: api
    container_name: goroad-go-api
    <<: *shared
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sandiandasalah
      DB_NAME: goroad_dbvi1
      REDIS_URL: redis:6379
      NATS_URL: nats:4222
      MINIO_ENDPOINT: minio:9000
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HOST: livekit:7880
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # GO BACKEND — WS
  # ============================================
  go-ws:
    build:
      context: ./go-road-backend
      dockerfile: ../docker/Dockerfile.go
      target: ws
    container_name: goroad-go-ws
    <<: *shared
    ports:
      - "8081:8081"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sandiandasalah
      DB_NAME: goroad_dbvi1
      REDIS_URL: redis:6379
      NATS_URL: nats:4222
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # GO BACKEND — WORKER
  # ============================================
  go-worker:
    build:
      context: ./go-road-backend
      dockerfile: ../docker/Dockerfile.go
      target: worker
    container_name: goroad-go-worker
    <<: *shared
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sandiandasalah
      DB_NAME: goroad_dbvi1
      REDIS_URL: redis:6379
      NATS_URL: nats:4222
      MINIO_ENDPOINT: minio:9000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # PYTHON — AI SERVICE
  # ============================================
  py-ai-service:
    build:
      context: ./py-ai-service
      dockerfile: Dockerfile
    container_name: goroad-py-ai
    <<: *shared
    ports:
      - "50051:50051"
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats:4222
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy

  # ============================================
  # PYTHON — ANALYTICS SERVICE
  # ============================================
  py-analytics-service:
    build:
      context: ./py-analytics-service
      dockerfile: Dockerfile
    container_name: goroad-py-analytics
    <<: *shared
    ports:
      - "50052:50052"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sandiandasalah
      DB_NAME: goroad_dbvi1
      REDIS_URL: redis://redis:6379/1
      NATS_URL: nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # PYTHON — DATA PIPELINE
  # ============================================
  py-data-pipeline:
    build:
      context: ./py-data-pipeline
      dockerfile: Dockerfile
    container_name: goroad-py-pipeline
    <<: *shared
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sandiandasalah
      DB_NAME: goroad_dbvi1
      REDIS_URL: redis://redis:6379/2
      NATS_URL: nats:4222
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # NEXT.JS ADMIN
  # ============================================
  admin:
    build:
      context: ./go-road-admin
      dockerfile: Dockerfile
    container_name: goroad-admin
    <<: *shared
    ports:
      - "3000:3000"
    environment:
      APP_ENV: production
      API_URL: http://go-api:8080
    depends_on:
      - go-api

  # ============================================
  # LIVEKIT (Voice/Video)
  # ============================================
  livekit:
    image: livekit/livekit-server:v1.6.3
    container_name: goroad-livekit
    <<: *shared
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - '0.0.0.0'
        rtc:
          port_range_start: 20000
          port_range_end: 30000
          tcp_port: 7881
          udp_port: 7882

  # ============================================
  # OSRM (Route Engine)
  # ============================================
  osrm:
    image: osrm/osrm-backend:v5.25.0
    container_name: goroad-osrm
    <<: *shared
    ports:
      - "5000:5000"
    volumes:
      - osrm-data:/data
    command: osrm-routed --algorithm mld /data/indonesia-latest.osrm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # MONITORING
  # ============================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: goroad-prometheus
    <<: *shared
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.4
    container_name: goroad-grafana
    <<: *shared
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:3.6.13
    container_name: goroad-loki
    <<: *shared
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki

volumes:
  postgres-data:
  redis-data:
  minio-data:
  osrm-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  goroad-network:
    driver: bridge
